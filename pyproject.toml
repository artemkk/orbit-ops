[project]
name = "orbit-ops"
version = "0.1.0"
description = "Simulated satellite constellation with telemetry pipeline and anomaly detection."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "artemkk" }]

dependencies = [
    # Orbit propagation
    "skyfield>=1.49",
    # Numerics
    "numpy>=1.26",
    "scipy>=1.13",
    # Data
    "pandas>=2.2",
    "pyarrow>=16.0",
    "duckdb>=1.0",
    # Streaming
    "confluent-kafka>=2.5",
    # Object storage
    "boto3>=1.34",
    # Config + logging
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "pyyaml>=6.0",
    # CLI
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "ipython>=8.25",
    "matplotlib>=3.9",
]
dbt = [
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
]

[project.scripts]
orbit-ops = "orbit_ops.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orbit_ops"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/orbit_ops/cli.py" = ["B008"]  # typer.Option() in defaults is Typer's intended API

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: tests that require external services (Redpanda, MinIO). Skipped if unreachable.",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
